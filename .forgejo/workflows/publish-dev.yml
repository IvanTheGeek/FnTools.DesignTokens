name: Publish dev package

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build FnTools.DesignTokens.slnx -c Release --nologo

      - name: Test
        run: dotnet test FnTools.DesignTokens.slnx -c Release --nologo --no-build

      - name: Pack (dev pre-release)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_VERSION="$(grep -m1 '<Version>' src/FnTools.DesignTokens/FnTools.DesignTokens.fsproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')"
          dotnet pack FnTools.DesignTokens.slnx -c Release --nologo --no-build \
            -o artifacts/ \
            -p:Version="${BASE_VERSION}-dev.${SHORT_SHA}"

      - name: Push to Forgejo NuGet feed
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source https://forgejo.ivanthegeek.com/api/packages/FnTools/nuget/index.json \
              --api-key "${{ secrets.FORGEJO_NUGET_TOKEN }}" \
              --skip-duplicate
          done
